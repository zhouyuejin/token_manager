global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'token-backend'
    static_configs:
      - targets: ['backend:8000']
        labels:
          service: 'token-manager'
          
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

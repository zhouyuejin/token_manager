services:
  mysql:
    ports: !override []
  redis:
    ports: !override []
  backend:
    build: !reset null
    image: ${ACR_IMAGE_PREFIX:?set ACR_IMAGE_PREFIX}/token-backend:${RELEASE_TAG:?set RELEASE_TAG}
    command: ["sh", "-c", "alembic upgrade head && exec uvicorn app.main:app --host 0.0.0.0 --port 8000"]
    ports: !override []
    environment:
      SECRET_ENCRYPTION_KEY: ${SECRET_ENCRYPTION_KEY:?set SECRET_ENCRYPTION_KEY}
      HTTP_PROXY: ${HTTP_PROXY-}
      HTTPS_PROXY: ${HTTPS_PROXY-}
      http_proxy: ${http_proxy-}
      https_proxy: ${https_proxy-}
      NO_PROXY: ${NO_PROXY:-localhost,127.0.0.1,mysql,redis}
      no_proxy: ${no_proxy:-localhost,127.0.0.1,mysql,redis}
      SMTP_USER: ${SMTP_USER-}
      SMTP_FROM_EMAIL: ${SMTP_FROM_EMAIL-}
    volumes: !override []
  backup:
    environment:
      MYSQL_PWD: ${MYSQL_PASSWORD:?set MYSQL_PASSWORD}
  nginx:
    image: ${ACR_IMAGE_PREFIX:?set ACR_IMAGE_PREFIX}/token-frontend:${RELEASE_TAG:?set RELEASE_TAG}
    ports: !override
      - "127.0.0.1:8083:80"
    volumes: !override
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./deploy/nginx-site.conf:/etc/nginx/conf.d/default.conf:ro
      - /var/log/token-manager/nginx:/var/log/nginx
  prometheus:
    ports: !override []
  grafana:
    ports: !override []

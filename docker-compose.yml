version: '3.8'

services:
  # MySQL数据库
  mysql:
    image: mysql:8.0
    container_name: token-mysql
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_password}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-token_db}
      MYSQL_USER: ${MYSQL_USER:-token_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-token_password}
    volumes:
      - mysql-data:/var/lib/mysql
      - ./mysql/init:/docker-entrypoint-initdb.d
    networks:
      - token-net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Redis缓存
  redis:
    image: redis:7-alpine
    container_name: token-redis
    ports:
      - "6379:6379"
    command: redis-server --requirepass ${REDIS_PASSWORD:-redis_password}
    volumes:
      - redis-data:/data
    networks:
      - token-net
    restart: unless-stopped

  # 后端服务
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: token-backend
    ports:
      - "8000:8000"
    environment:
      - MYSQL_HOST=mysql
      - MYSQL_PORT=3306
      - MYSQL_USER=${MYSQL_USER:-token_user}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD:-token_password}
      - MYSQL_DATABASE=${MYSQL_DATABASE:-token_db}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:-redis_password}
      - SECRET_KEY=${SECRET_KEY:-your-secret-key-change-in-production}
      - ALGORITHM=HS256
      - ACCESS_TOKEN_EXPIRE_MINUTES=30
      - OIDC_ISSUER_URL=${OIDC_ISSUER_URL:-}
      - OIDC_CLIENT_ID=${OIDC_CLIENT_ID:-}
      - OIDC_CLIENT_SECRET=${OIDC_CLIENT_SECRET:-}
      - OIDC_REDIRECT_URI=${OIDC_REDIRECT_URI:-}
      - OIDC_FRONTEND_URL=${OIDC_FRONTEND_URL:-}
      - PASSWORD_LOGIN_ENABLED=${PASSWORD_LOGIN_ENABLED:-true}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASSWORD=${SMTP_PASSWORD:-}
      - SMTP_FROM_EMAIL=${SMTP_FROM_EMAIL:-}
      - SMTP_FROM_NAME=${SMTP_FROM_NAME:-Token Manager}
      - HTTP_PROXY=${HTTP_PROXY:-http://host.docker.internal:1082}
      - HTTPS_PROXY=${HTTPS_PROXY:-http://host.docker.internal:1082}
      - http_proxy=${http_proxy:-http://host.docker.internal:1082}
      - https_proxy=${https_proxy:-http://host.docker.internal:1082}
      - NO_PROXY=${NO_PROXY:-localhost,127.0.0.1,mysql,redis,deb.debian.org,security.debian.org}
      - no_proxy=${no_proxy:-localhost,127.0.0.1,mysql,redis,deb.debian.org,security.debian.org}
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      - ./backend:/app
      - ./docs:/app/docs:ro
      - /app/__pycache__
    networks:
      - token-net
    restart: unless-stopped

  # 每日逻辑备份，使用 UTC 18:00（Asia/Shanghai 02:00）
  backup:
    image: mysql:8.0
    container_name: token-backup
    command: ["bash", "/scripts/daily-backup.sh"]
    environment:
      - MYSQL_HOST=mysql
      - MYSQL_PORT=3306
      - MYSQL_USER=${MYSQL_USER:-token_user}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD:-token_password}
      - MYSQL_DATABASE=${MYSQL_DATABASE:-token_db}
    volumes:
      - ./backups:/backups
      - ./scripts/daily-backup.sh:/scripts/daily-backup.sh:ro
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - token-net
    restart: unless-stopped

  # Nginx反向代理
  nginx:
    image: nginx:alpine
    container_name: token-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/logs:/var/log/nginx
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - ./frontend/dist:/usr/share/nginx/html:ro
    depends_on:
      - backend
    networks:
      - token-net
    restart: unless-stopped

  # Prometheus监控
  prometheus:
    image: prom/prometheus:latest
    container_name: token-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    networks:
      - token-net
    restart: unless-stopped

  # Grafana监控面板
  grafana:
    image: grafana/grafana:latest
    container_name: token-grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-admin}
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    networks:
      - token-net
    depends_on:
      - prometheus
    restart: unless-stopped

volumes:
  mysql-data:
  redis-data:
  prometheus-data:
  grafana-data:

networks:
  token-net:
    driver: bridge
